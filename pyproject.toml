[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malayalam-agglutination-splitter"
version = "0.1.0"
description = "ByT5 recipes for Malayalam agglutination and morpheme-boundary segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20", "sentencepiece>=0.2"]

[project.optional-dependencies]
train = ["accelerate>=0.33", "evaluate>=0.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
